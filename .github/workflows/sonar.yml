name: SonarCloud

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build, test and analyze (with retry)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ok=0
          for i in 1 2 3; do
            if ./mvnw -B clean verify sonar:sonar \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.organization=alexgurianov207 \
              -Dsonar.projectKey=AlexGurianov207_car-sharing; then
              ok=1
              break
            fi
            echo "Attempt $i failed; retrying in 20s..."
            sleep 20
          done

          if [ "$ok" -ne 1 ]; then
            echo "Maven/Sonar failed after 3 attempts"
            exit 1
          fi

